services:
  # ============================================================================
  # ASP.NET Core Example behind Nginx
  # ============================================================================
  aspnetcore_app:
    build:
      context: .
      dockerfile: examples/aspnetcore-nginx/Dockerfile
    environment:
      - HOPFENCE_ENABLED=true
      - HOPFENCE_TOKEN=demo-aspnetcore-secret-token
    networks:
      - hopfence_net

  nginx_aspnetcore:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./examples/aspnetcore-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - aspnetcore_app
    networks:
      - hopfence_net

  # ============================================================================
  # Express.js Example behind Nginx
  # ============================================================================
  express_app:
    build:
      context: .
      dockerfile: examples/express-nginx/Dockerfile
    environment:
      - HOPFENCE_ENABLED=true
      - HOPFENCE_TOKEN=demo-express-secret-token
    networks:
      - hopfence_net

  nginx_express:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./examples/express-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - express_app
    networks:
      - hopfence_net

networks:
  hopfence_net:
    driver: bridge
