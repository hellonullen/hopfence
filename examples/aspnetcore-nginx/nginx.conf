events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream aspnetcore_backend {
        server aspnetcore_app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # SECURE REVERSE PROXY CONFIGURATION FOR ASP.NET CORE
        # -------------------------------------------------------------
        location / {
            proxy_pass http://aspnetcore_backend;
            proxy_http_version 1.1;

            # 1. Forward real client IP securely:
            # Using $remote_addr or $proxy_add_x_forwarded_for
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 2. Forward true request scheme
            proxy_set_header X-Forwarded-Proto $scheme;

            # 3. Forward original Host header
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;

            # Connection headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
